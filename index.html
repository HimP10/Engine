	<!-- Local CORS Bypass Interceptor for Lime/OpenFL -->
	<script type="text/javascript">
		// Overrides XMLHttpRequest to prevent CORS local file blocks on file:///
		(function() {
			var origOpen = XMLHttpRequest.prototype.open;
			var origSend = XMLHttpRequest.prototype.send;
			
			XMLHttpRequest.prototype.open = function(method, url) {
				this._url = url;
				return origOpen.apply(this, arguments);
			};
			
			XMLHttpRequest.prototype.send = function(data) {
				// Intercepts local file calls and serves them inline if provided
				if (window.INLINE_ASSETS && window.INLINE_ASSETS[this._url]) {
					var self = this;
					setTimeout(function() {
						Object.defineProperty(self, 'status', { writable: false, value: 200 });
						Object.defineProperty(self, 'responseText', { writable: false, value: window.INLINE_ASSETS[self._url] });
						self.dispatchEvent(new Event('load'));
					}, 1);
					return;
				}
				return origSend.apply(this, arguments);
			};
		})();

		// Place embedded Base64 assets here if packing custom assets
		window.INLINE_ASSETS = {};
	</script>
